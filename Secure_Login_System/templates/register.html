<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <div class="card">
        <div class="icon">🛡️</div>
        <h1>Create Account</h1>
        <p class="subtitle">Register for a secure account</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <label>Username</label>
            <input type="text" name="username" placeholder="3-30 characters" required maxlength="30">

            <label>Email</label>
            <input type="email" name="email" placeholder="example@email.com" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Minimum 8 characters" required minlength="8">

            <button type="submit">Register</button>
        </form>

        <p class="bottom-text">Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>
    </div>
</div>
</body>
</html>
